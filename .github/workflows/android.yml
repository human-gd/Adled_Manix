name: Build Adled Manix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - Android64
          - Android32

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: latest
          cli: latest
          build-config: Release
          use-lto: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Adled-Manix-${{ matrix.target }}
          path: |
            build-*/**/*.geode
